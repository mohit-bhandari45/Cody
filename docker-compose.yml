version: "3.8"

services:
  postgres:
    build: ./docker/postgres
    container_name: pr-bot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pr-bot-pg-data:/var/lib/postgresql/data

volumes:
  pr-bot-pg-data: